<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Evento click - Nivel 4</title>
  <style>

    body { font-family: Arial, sans-serif; }

    #contador { font-size: 24px; font-weight: bold; }

    .verde { color: green; }

    .rojo { color: red; font-weight: bold; }

  </style>
</head>
<body>
  <h1>Contador de clics</h1>
  <p>Has hecho clic <span id="contador">0</span> veces.</p>
  <button id="btnSumar">Sumar 1</button>
  <button id="btnReiniciar">Reiniciar</button>
 
  <script>
    let total = 0;
    const salida = document.getElementById("contador");
    const btnSumar = document.getElementById("btnSumar");
    const btnReiniciar = document.getElementById("btnReiniciar");
 
    function sumar() {
      total = total + 1;
      salida.textContent = total;
       if (total === 5) {
        salida.classList.remove("rojo");
        salida.classList.add("verde");
      } else if (total === 10) {
        salida.classList.remove("verde");
        salida.classList.add("rojo");
      }
    }
 
    function reiniciar() {
      total = 0;
      salida.textContent = total;
      salida.classList.remove("verde", "rojo");
    }
 
    btnSumar.addEventListener("click", sumar);
    btnReiniciar.addEventListener("click", reiniciar);
  </script>
</body>
</html>
